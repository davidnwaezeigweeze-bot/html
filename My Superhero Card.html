<!DOCTYPE html>
<html 
<head>
    <title>My Superhero Card</title>
    <style>

       /* Typography - front, size, weigth, colour for the whole page */
       body {
        background-color: darkblue;
        color: white;
         font-family: Arial, sans-serif;
       } 

       /* Typography + Text shadow - big bold title with an orange shadow */
       .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px orange;
       }

       /* Typography + text Transfrom - tagline becomes Title case */
       *tagline {
        font-style: italic;
        color: lightblue;
        text-transform: capitalize;
       }

       /* text Transform + Text Decoration - section headings in CAPS with underline */
       .label {
        text-transform: uppercase;
        text-decoration: underline;
        color: coral;
       }

       /* Typography - power stand out in bold green*/
       .power {
        font-weight: bold;
        color: lightgreen;
       }

        /* text Decoration - weaknesses are crossed out */
        .weakness{
            text-decoration: line-through;
            color: gray;
        }

        /* Tranform - the badge is tilted to the side */
        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        /* Typography - footer text */
        .made-by {
            color: coral;
            font-style: italic;
        }

    </style>
</head>
<body>

    <h1 class="hero-name">Thunder kid</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label"> super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class=""></p>
    
</body>
</html>
